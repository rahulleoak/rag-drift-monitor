# Single source of truth for paths, datasets, periods, models and thresholds.
# Code reads values from here; nothing below should be hard-coded elsewhere.
#
# Values set to null are decided later, and the comment says where:
#   - dataset and periods: after data exploration (docs/questions.md Q1, Q3)
#   - thresholds: written down BEFORE looking at experiment results (Q11), so
#     they cannot be tuned to make results look good.

paths:
  data_raw: data/raw
  data_processed: data/processed
  data_sample: data/sample
  cache: cache          # embeddings and LLM responses
  runs: runs            # one folder per pipeline run: reports and charts
  demo_runs: demo/runs  # a committed copy of one run, so the dashboard works without a key (scripts/export_demo.py)
  indexes: indexes      # FAISS indexes with a manifest, saved by Agent C (D22)

# Candidate datasets. Both are explored before one is chosen (Q1).
datasets:
  huffpost:
    file: data/raw/News_Category_Dataset_v3.json
    source: https://www.kaggle.com/datasets/rmisra/news-category-dataset
    # The full dataset (Kaggle lists this single file), checked 2026-11-04 (F1).
    bytes: 87295572
    sha256: 2cfc51fa4a82a96ecbe251fa383737aa1dea2e0a517f61dece633fcc25a4a065
    license: CC BY 4.0
  arxiv:
    file: data/raw/arxiv-metadata-oai-snapshot.json
    source: https://www.kaggle.com/datasets/Cornell-University/arxiv

active_dataset: huffpost   # D3, F1

seed: 42                # every random sample in the project uses this

exploration:
  samples_per_year: 5   # example titles printed per year
  # Terms tied to known real-world events, used to check that known drift is
  # visible in the data at all. Regex, matched case-insensitively on title + text.
  watch_terms:
    covid: '\bcovid'
    coronavirus: '\bcoronavirus'
    pandemic: '\bpandemic'
    vaccine: '\bvaccin'
    mask: '\bmasks?\b'
    trump: '\btrump\b'
    metoo: '#?\bme ?too\b'
  # Baselines compared by scripts/exploration/compare_baselines.py (F2, D6).
  baseline_candidates:
    - {name: "2012-13", start: "2012-01-01", end: "2013-12-31"}
    - {name: "2014-15", start: "2014-01-01", end: "2015-12-31"}
    - {name: "2015",    start: "2015-01-01", end: "2015-12-31"}
    - {name: "2015-16", start: "2015-01-01", end: "2016-12-31"}
    - {name: "2016-17", start: "2016-01-01", end: "2017-12-31"}
    - {name: "2017",    start: "2017-01-01", end: "2017-12-31"}

periods:
  # D6: baseline 2016-17, closest in topic mix to the later years (F2).
  # To be re-evaluated if the checks listed in D6 fail.
  baseline: {name: "2016-17", start: "2016-01-01", end: "2017-12-31"}
  later:
    - {name: "2018", start: "2018-01-01", end: "2018-12-31"}
    - {name: "2019", start: "2019-01-01", end: "2019-12-31"}
    - {name: "2020", start: "2020-01-01", end: "2020-12-31"}
    - {name: "2021", start: "2021-01-01", end: "2021-12-31"}
    - {name: "2022", start: "2022-01-01", end: "2022-12-31"}   # data ends 2022-09-23
  # Equal-size random samples for the drift statistics only (the indexes use
  # every cleaned document). 1,398 = all of 2022, the smallest period after
  # cleaning (F3).
  sample_per_period: 1398
  min_segment_size: 50      # smallest period x category group that gets analysed

# D16: the simulator writes the golden evaluation set (one question per article).
simulation:
  min_words: 15            # articles shorter than this rarely state an answerable fact
  # Templated columns have no single right answer (F3): never used as sources.
  exclude_title_patterns: ["funniest tweets", "tweets from", "huffpost rise", "daily meditation",
                           "headline quiz", "what to watch", "sunday roundup", "morning email",
                           "what you need to know"]
  max_questions_per_article: 2   # D17: a second question only for a time-sensitive fact
  reviews_per_question: 2        # D19: independent reviews; a question is kept only if all accept it
  pilot_counts: {"2016-17": 5, "2018": 3, "2019": 3, "2020": 3, "2021": 3, "2022": 3}
  # D20: oversample of articles likely to state a revisable fact (tolls, counts still
  # being reported, ongoing situations, current rules), because random sampling gave
  # too few time-sensitive questions (F9). Reported as its own group, never mixed
  # into archive-wide rates.
  oversample_patterns: ['\bat least\b', '\bso far\b', '\bmissing\b', 'death toll', '\btoll\b', '\bstill\b',
                        '\bongoing\b', '\bcurrently\b', '\bnew (?:rules?|guidance|restrictions?)\b',
                        '\bwill take effect\b', '\brising\b', '\bclimb(?:s|ed|ing)?\b',
                        '\bsurg(?:e|es|ed|ing)\b', '\bcases\b', '\blatest\b', '\bremains?\b',
                        '\binvestigat(?:ion|ing)\b', '\bdeveloping\b', '\bdead\b', '\bkilled\b']
  # D23: the full question set. Articles are drawn from flagged sections, control
  # sections, plain random, and the revisable-fact oversample; each is tagged.
  full_set:
    per_flagged_segment: 8     # per flagged period x section (Agent B's drifted segments)
    per_control_segment: 3     # per low-drift control segment
    random_baseline: 40        # plain random baseline articles (the control questions)
    random_per_period: 20      # plain random articles per later period
    oversample_per_period: 34  # likely-revisable articles per period (D20)
  question_checks:
    min_words: 6
    max_words: 30
    copy_ngram: 4              # reject a question repeating 4 consecutive headline words
    copy_ngram_description: 7  # ... or 7 description words (D17; 5 rejected names such as "8-year-old Malayan tiger named Eko")
    max_headline_overlap: 0.7  # reject if most of its content words come from the headline
    duplicate_cosine: 0.95

# HuffPost renamed several sections over the years (F1). Old label -> label
# used from 2018 on, so the same section can be compared across periods.
# Applied for analysis only; raw labels are kept and their changes reported.
categories:
  normalise:
    HEALTHY LIVING: WELLNESS        # 2014-2018, WELLNESS before and after
    PARENTS: PARENTING              # 2014-2018
    TASTE: FOOD & DRINK             # 2014-2018
    STYLE: STYLE & BEAUTY           # 2014-2018
    GREEN: ENVIRONMENT              # 2014-2018
    WORLDPOST: WORLD NEWS           # 2014-2017
    THE WORLDPOST: WORLD NEWS       # 2015-2017; WORLD NEWS from 2017
    ARTS: CULTURE & ARTS            # 2014-2017
    ARTS & CULTURE: CULTURE & ARTS  # 2015-2018

# D8 / F3: first-version rules chosen from the data; to be revisited as
# later findings come in. Applied in this order; each rule only sees what the
# previous ones kept.
data_cleaning:
  drop_empty_text: true       # all 1,034 empty descriptions are in the baseline; later years have none
  min_words: 8                # title + description; fewer carries too little meaning to embed
  max_words: 80               # later years never exceed 53; mostly baseline "Sunday Roundup" newsletters
  near_duplicate_cosine: 0.95 # within a period, keep the earliest copy; >= 0.95 is reposts and templates

embeddings:
  model: BAAI/bge-small-en-v1.5           # Q12
  query_prefix: "Represent this sentence for searching relevant passages: "
  batch_size: 64

retrieval:
  top_k: 10
  judge_k: 5                    # D25: the judge grades the pooled top 5 of both indexes (what the answer step reads)
  index_type: faiss_flat_ip               # exact search, Q13

# D9: a different, stronger model judges than the one that writes questions
# and answers, to reduce self-preference. No temperature setting: current
# models reject it; reproducibility comes from the disk cache of responses.
llm:
  provider: anthropic
  generator_model: claude-sonnet-5-5   # writes test questions, reference answers, RAG answers, explanations
  judge_model: claude-opus-5-5         # judges relevance and answer quality
  use_batch_api: true                  # bulk jobs run through the Batch API (50% cheaper, not instant)
  budget_usd: 150                      # D15: total spending cap (author, 2026-11-05); enforced before every call
  max_retries: 4                       # SDK retries for rate limits and server errors
  # Published prices, USD per million tokens (checked 2026-11-04). The Batch API
  # costs half. Thinking tokens are billed as output.
  prices:
    claude-sonnet-5-5: {input: 2.0, output: 10.0}
    claude-opus-5-5: {input: 4.0, output: 20.0}
  # Per job: thinking effort (low / medium / high), output cap (thinking counts
  # towards it), and the output size assumed when estimating cost in advance.
  jobs:
    questions:       {effort: medium, max_tokens: 4000, expected_output: 900}
    question_review: {effort: medium, max_tokens: 3000, expected_output: 700}
    relevance:       {effort: low, max_tokens: 3000, expected_output: 600}
    answers:         {effort: low, max_tokens: 2000, expected_output: 400}
    answer_judge:    {effort: low, max_tokens: 3000, expected_output: 500}
    fact_questions:  {effort: low, max_tokens: 2000, expected_output: 300}
    wiki_answers:    {effort: low, max_tokens: 2000, expected_output: 400}
    answer_change:   {effort: low, max_tokens: 2000, expected_output: 300}
    explanations:    {effort: low, max_tokens: 2000, expected_output: 300}

# D26: long-form documents where chunking applies (stakeholder request, 2026-11-06).
# Wikipedia articles captured at the last revision before the end of each period
# in `periods` (2016-17 = end of 2017, ...), followed by page id across renames.
longform:
  api: https://en.wikipedia.org/w/api.php
  # Wikimedia asks for a descriptive User-Agent; a project URL, no personal email.
  user_agent: "rag-drift-monitor/0.1 (research prototype; https://github.com/rahulleoak/rag-drift-monitor)"
  request_pause_s: 0.2
  vital_list: "Wikipedia:Vital articles/Level 3"   # about 1,000 broad topics in 11 sections
  per_section: 14                                  # stratified random sample
  # Known-drift check: articles tied to events of 2018-2022, labelled separately
  # and never mixed into sample-wide rates.
  event_titles: ["COVID-19 pandemic", "Coronavirus", "Vaccine", "Pandemic", "Social distancing",
                 "Remote work", "Climate change", "Brexit", "Ukraine", "Joe Biden",
                 "Cryptocurrency", "Artificial intelligence"]
  skip_sections: ["references", "external links", "see also", "further reading", "notes", "bibliography",
                  "sources", "citations", "footnotes", "notes and references", "works cited", "gallery",
                  "explanatory notes", "general and cited sources", "general sources", "cited sources"]
  min_words: 500               # shorter snapshots are not long-form (stubs or redirects)
  chunking:
    size_tokens: 256           # bge-small reads at most 512; 256 keeps a chunk to one point
    overlap_tokens: 32         # last whole sentences of the previous chunk
    min_tokens: 20             # a smaller final piece is merged into the previous chunk
    compare_sizes: [128, 256]  # chunk sizes compared in the chunking experiment
  # Set before looking at results: a pair counts as a "big change" when at least this
  # share of the later version's words is in new or rewritten sentences.
  big_change: 0.2
  # Ordinary-year reference: each article at the end of 2016, so 2016 -> 2017 shows how
  # much a normal year of editing changes an article (bands, as D11 does for HuffPost).
  reference_period: {name: "2016", end: "2016-12-31"}
  band_percentiles: {medium: 95, high: 99}
  fact_min_similarity: 0.6     # D27: word overlap for a changed sentence to count as the same statement
  # D28: does a flagged changed fact change the answer? (the harm step of D27)
  outdated:
    items_per_group: 60          # flagged changed facts, and edited sentences with unchanged numbers
    top_k: 3                     # passages the answer step reads from each version's chunk index
    min_difference: 0.2          # flagged must change answers at least 20 points more often than the comparison group
    alpha: 0.05                  # and the difference must be significant (Fisher's exact test)
  mmd_sample: 1500             # chunks per side for the archive-level MMD test
  mmd_permutations: 200

drift:
  alpha: 0.05
  multiple_testing: benjamini-hochberg
  mmd_permutations: 500
  compare_to: [baseline, previous_period]   # cumulative and period-over-period (proposal P1)
  severity_null_percentiles: {medium: 95, high: 99}   # bands calibrated on within-baseline drift (P7)
  # D11: "ordinary change" = the same month one year apart inside the baseline
  # (Jan 2016 vs Jan 2017, ...), each pair re-sampled null_draws times.
  null_draws: 5
  null_permutations: 50      # only to estimate the shuffled JSD average for "excess"
  # D12: emerging topics = clusters whose share of a period grows vs the baseline
  topics_k: 40               # number of clusters over all drift samples
  topic_min_ratio: 3.0       # period share at least 3x the baseline share
  topic_min_docs: 15
  # D12: term-context shift; terms need >= context_min_docs articles on both sides
  context_terms: [mask, virus, vaccine, outbreak, cases, test, home, biden, ukraine, russia,
                  capitol, abortion, impeachment, police, climate, border, election]
  context_min_docs: 20

evaluation:
  queries_per_segment: null      # set once the LLM budget is known
  judge_validation_items: 40     # hand-labelled items used to check the LLM judge
  question_set: full             # data/processed/questions_<name>.parquet (D23)
  # D7: the query stream = questions from pools drawn the same way in every
  # period; flagged/control pools are picked by document drift, so excluded here
  query_stream_pools: [random, oversample]

impact:
  min_retrieval_drop: null       # practical-significance thresholds, set before running (Q11)
  min_answer_quality_drop: 0.10  # D28: a drop in correct answers of 10+ points (stale vs refreshed) is material, if its interval excludes 0
  min_segment_questions: 8       # segments with fewer judged questions are reported, not classified
  answer_k: 5                    # articles the answer step reads (the judged top k, D25)
  recovered_correct: 0.6         # refreshed index answers at least this share correctly -> the content was missing (re-index)
  retrieval_ok: 0.6              # top k holds an answer for at least this share -> retrieval is not the problem
  bootstrap_resamples: 2000
  max_evidence_loops: 1          # how many times Impact may ask Retrieval Eval for more queries

# D29: Agent E. One rule per action in the brief; the LLM only explains.
recommendation:
  explain: true                  # Sonnet writes a short explanation per recommended action (number-checked)
  min_text_beyond_model: 0.5     # chunking matters when at least half of a typical document is past the model's limit
  min_chunking_gain: 0.1         # chunks must follow real edits this much better (Spearman) than the first 512 tokens
  max_hallucinated: 0.05         # answers with claims not in the articles: above this share, revise the prompt
  min_judge_agreement: 0.7       # judge vs blind hand labels below this -> a human checks the judge (two people agreed 0.8, F19)
  longform_dir: runs/longform    # changed facts, outdated-answer test, chunking experiment (scripts/longform_drift.py, outdated_answers.py)
  # Blind hand labels vs the LLM (F19, F20). First passes only: they are independent of the judge.
  label_checks:
    - {file: runs/labels/agreement_first_pass.csv, who: "author (first pass)"}
    - {file: runs/labels/agreement_second.csv, who: "second labeller"}
    - {file: runs/labels/answers/agreement_sheet_first_pass.csv, who: "author (first pass)"}
